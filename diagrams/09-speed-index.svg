<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#E8ECF1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="380" fill="url(#bg9)" rx="12"/>

  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2C3E50">Speed Index</text>
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#7F8C8D">Visual completeness over time (integral of incompleteness)</text>

  <!-- Chart area -->
  <g transform="translate(70, 70)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="200" stroke="#2C3E50" stroke-width="2"/>
    <line x1="0" y1="200" x2="640" y2="200" stroke="#2C3E50" stroke-width="2"/>

    <!-- Y axis labels -->
    <text x="-10" y="5" text-anchor="end" font-size="10" fill="#555">100%</text>
    <text x="-10" y="55" text-anchor="end" font-size="10" fill="#555">75%</text>
    <text x="-10" y="105" text-anchor="end" font-size="10" fill="#555">50%</text>
    <text x="-10" y="155" text-anchor="end" font-size="10" fill="#555">25%</text>
    <text x="-10" y="205" text-anchor="end" font-size="10" fill="#555">0%</text>
    <text x="-50" y="105" text-anchor="middle" font-size="11" fill="#2C3E50" font-weight="bold" transform="rotate(-90,-50,105)">Visual Completeness</text>

    <!-- X axis labels -->
    <text x="0" y="220" text-anchor="middle" font-size="10" fill="#555">0s</text>
    <text x="160" y="220" text-anchor="middle" font-size="10" fill="#555">1s</text>
    <text x="320" y="220" text-anchor="middle" font-size="10" fill="#555">2s</text>
    <text x="480" y="220" text-anchor="middle" font-size="10" fill="#555">3s</text>
    <text x="640" y="220" text-anchor="middle" font-size="10" fill="#555">4s</text>
    <text x="320" y="240" text-anchor="middle" font-size="11" fill="#2C3E50" font-weight="bold">Time</text>

    <!-- Good site (progressive rendering) -->
    <path d="M0,200 C80,180 120,80 200,30 C240,10 300,5 640,0" fill="none" stroke="#2ECC71" stroke-width="3"/>
    <!-- Area under incompleteness (small) -->
    <path d="M0,200 C80,180 120,80 200,30 C240,10 300,5 640,0 L640,0 L0,0 Z" fill="#2ECC71" opacity="0.1"/>

    <!-- Poor site (late rendering) -->
    <path d="M0,200 L300,200 C340,190 380,100 420,20 C440,5 480,0 640,0" fill="none" stroke="#E74C3C" stroke-width="3"/>
    <!-- Area under incompleteness (large) -->
    <path d="M0,200 L300,200 C340,190 380,100 420,20 C440,5 480,0 640,0 L640,0 L0,0 Z" fill="#E74C3C" opacity="0.08"/>

    <!-- Incompleteness shading for poor site -->
    <path d="M0,0 L0,200 L300,200 C340,190 380,100 420,20 C440,5 480,0 640,0 L640,0 Z" fill="#E74C3C" opacity="0.08"/>

    <!-- Legend -->
    <line x1="420" y1="55" x2="450" y2="55" stroke="#2ECC71" stroke-width="3"/>
    <text x="455" y="59" font-size="11" fill="#2ECC71" font-weight="bold">Good: Progressive (SI ~1200ms)</text>

    <line x1="420" y1="75" x2="450" y2="75" stroke="#E74C3C" stroke-width="3"/>
    <text x="455" y="79" font-size="11" fill="#E74C3C" font-weight="bold">Poor: Late render (SI ~3800ms)</text>

    <!-- Speed Index = shaded area annotation -->
    <text x="100" y="100" font-size="12" fill="#E74C3C" opacity="0.6" font-weight="bold">Speed Index =</text>
    <text x="100" y="116" font-size="12" fill="#E74C3C" opacity="0.6" font-weight="bold">shaded area</text>
  </g>

  <!-- Formula -->
  <rect x="70" y="320" width="660" height="45" rx="10" fill="white" stroke="#F39C12" stroke-width="1"/>
  <text x="400" y="342" text-anchor="middle" font-size="13" fill="#2C3E50" font-weight="bold">
    SpeedIndex = integral from 0 to t_end of (1 - VisualCompleteness(t) / 100) dt
  </text>
  <text x="400" y="358" text-anchor="middle" font-size="11" fill="#7F8C8D">Good: &#x2264;3.4s | Needs Improvement: 3.4-5.8s | Poor: &#x003E;5.8s</text>
</svg>