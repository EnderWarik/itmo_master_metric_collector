<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#E8ECF1"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bg6)" rx="12"/>

  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2C3E50">Resource Timing &amp; CDP Metrics (page.resources)</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#7F8C8D">6 data sources, 40+ metrics</text>

  <!-- Source 1: Resource Timing API -->
  <rect x="20" y="65" width="270" height="150" rx="10" fill="white" stroke="#3498DB" stroke-width="2"/>
  <rect x="20" y="65" width="270" height="30" rx="10" fill="#3498DB"/>
  <text x="155" y="85" text-anchor="middle" font-size="12" fill="white" font-weight="bold">1. Resource Timing API</text>
  <text x="30" y="112" font-size="10" fill="#555">totalResources, totalTransferSize</text>
  <text x="30" y="127" font-size="10" fill="#555">apiRequests, avgApiDurationMs</text>
  <text x="30" y="142" font-size="10" fill="#555">scriptsCount, scriptsTotalSize</text>
  <text x="30" y="157" font-size="10" fill="#555">cssCount, cssTotalSize</text>
  <text x="30" y="175" font-size="9" fill="#3498DB">performance.getEntriesByType('resource')</text>

  <!-- Source 2: CDP Performance -->
  <rect x="310" y="65" width="270" height="150" rx="10" fill="white" stroke="#E74C3C" stroke-width="2"/>
  <rect x="310" y="65" width="270" height="30" rx="10" fill="#E74C3C"/>
  <text x="445" y="85" text-anchor="middle" font-size="12" fill="white" font-weight="bold">2. CDP Performance (V8)</text>
  <text x="320" y="112" font-size="10" fill="#555">scriptDurationMs, taskDurationMs</text>
  <text x="320" y="127" font-size="10" fill="#555">jsHeapUsedSize, jsHeapTotalSize</text>
  <text x="320" y="142" font-size="10" fill="#555">layoutCount, layoutDurationMs</text>
  <text x="320" y="157" font-size="10" fill="#555">recalcStyleCount, domNodes</text>
  <text x="320" y="175" font-size="9" fill="#E74C3C">Performance.getMetrics() [seconds!]</text>

  <!-- Source 3: GC Tracing -->
  <rect x="600" y="65" width="280" height="150" rx="10" fill="white" stroke="#9B59B6" stroke-width="2"/>
  <rect x="600" y="65" width="280" height="30" rx="10" fill="#9B59B6"/>
  <text x="740" y="85" text-anchor="middle" font-size="12" fill="white" font-weight="bold">3. GC (CDP Tracing)</text>
  <text x="610" y="112" font-size="10" fill="#555">gcCount, gcTotalDurationMs</text>
  <text x="610" y="127" font-size="10" fill="#555">gcMaxDurationMs</text>
  <text x="610" y="147" font-size="10" fill="#9B59B6" font-weight="bold">V8 GC Types:</text>
  <text x="610" y="162" font-size="9" fill="#555">Scavenger (minor, &#x003C;1ms)</text>
  <text x="610" y="175" font-size="9" fill="#555">Mark-Compact (major, 10-200ms)</text>
  <text x="610" y="188" font-size="9" fill="#9B59B6">categories: v8.gc</text>

  <!-- Source 4: Coverage -->
  <rect x="20" y="230" width="270" height="130" rx="10" fill="white" stroke="#2ECC71" stroke-width="2"/>
  <rect x="20" y="230" width="270" height="30" rx="10" fill="#2ECC71"/>
  <text x="155" y="250" text-anchor="middle" font-size="12" fill="white" font-weight="bold">4. Code Coverage</text>
  <text x="30" y="277" font-size="10" fill="#555">unusedJsPercent, jsTotalBytes</text>
  <text x="30" y="292" font-size="10" fill="#555">unusedCssPercent, cssTotalBytes</text>
  <text x="30" y="312" font-size="9" fill="#2ECC71">JS: Profiler.startPreciseCoverage()</text>
  <text x="30" y="327" font-size="9" fill="#2ECC71">CSS: CSS.startRuleUsageTracking()</text>
  <text x="30" y="345" font-size="9" fill="#555">unused% = unusedBytes / totalBytes x 100</text>

  <!-- Source 5: Parse/Compile -->
  <rect x="310" y="230" width="270" height="130" rx="10" fill="white" stroke="#F39C12" stroke-width="2"/>
  <rect x="310" y="230" width="270" height="30" rx="10" fill="#F39C12"/>
  <text x="445" y="250" text-anchor="middle" font-size="12" fill="white" font-weight="bold">5. JS Parse / Compile</text>
  <text x="320" y="277" font-size="10" fill="#555">jsParseMs, jsCompileMs</text>
  <text x="320" y="297" font-size="9" fill="#F39C12" font-weight="bold">V8 Pipeline:</text>
  <text x="320" y="312" font-size="9" fill="#555">Source &#x2192; Parse (AST) &#x2192; Ignition (bytecode)</text>
  <text x="320" y="327" font-size="9" fill="#555">&#x2192; TurboFan (optimized machine code)</text>
  <text x="320" y="345" font-size="9" fill="#F39C12">categories: v8.compile [dur in us!]</text>

  <!-- Source 6: Network -->
  <rect x="600" y="230" width="280" height="130" rx="10" fill="white" stroke="#1ABC9C" stroke-width="2"/>
  <rect x="600" y="230" width="280" height="30" rx="10" fill="#1ABC9C"/>
  <text x="740" y="250" text-anchor="middle" font-size="12" fill="white" font-weight="bold">6. Network / Cache / SW</text>
  <text x="610" y="277" font-size="10" fill="#555">http2Percent, http3Percent</text>
  <text x="610" y="292" font-size="10" fill="#555">cacheHitPercent, cacheHitCount</text>
  <text x="610" y="307" font-size="10" fill="#555">swUsed, swStartMs</text>
  <text x="610" y="322" font-size="10" fill="#555">avgContentDownloadMs</text>
  <text x="610" y="340" font-size="9" fill="#1ABC9C">Cache: transferSize === 0</text>
  <text x="610" y="353" font-size="9" fill="#1ABC9C">SW: workerStart &#x003E; 0</text>

  <!-- Resource waterfall diagram -->
  <text x="30" y="390" font-size="14" font-weight="bold" fill="#2C3E50">Resource Entry Timing (per resource):</text>

  <g transform="translate(30, 400)">
    <line x1="0" y1="15" x2="840" y2="15" stroke="#ECF0F1" stroke-width="30" stroke-linecap="round"/>

    <rect x="0" y="2" width="60" height="26" rx="4" fill="#95A5A6" opacity="0.6"/>
    <text x="30" y="20" text-anchor="middle" font-size="8" fill="white">Redirect</text>

    <rect x="65" y="2" width="70" height="26" rx="4" fill="#3498DB"/>
    <text x="100" y="20" text-anchor="middle" font-size="8" fill="white">DNS</text>

    <rect x="140" y="2" width="70" height="26" rx="4" fill="#2ECC71"/>
    <text x="175" y="20" text-anchor="middle" font-size="8" fill="white">TCP</text>

    <rect x="215" y="2" width="60" height="26" rx="4" fill="#9B59B6"/>
    <text x="245" y="20" text-anchor="middle" font-size="8" fill="white">TLS</text>

    <rect x="280" y="2" width="120" height="26" rx="4" fill="#E67E22"/>
    <text x="340" y="20" text-anchor="middle" font-size="8" fill="white">Waiting (TTFB)</text>

    <rect x="405" y="2" width="200" height="26" rx="4" fill="#E74C3C"/>
    <text x="505" y="20" text-anchor="middle" font-size="8" fill="white">Content Download</text>

    <text x="620" y="20" font-size="10" fill="#2C3E50" font-weight="bold">| transferSize | encodedBodySize | decodedBodySize</text>
  </g>

  <!-- Size properties explanation -->
  <g transform="translate(30, 450)">
    <rect x="0" y="0" width="840" height="65" rx="8" fill="white" stroke="#BDC3C7"/>
    <text x="420" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3E50">Size Properties:</text>

    <rect x="20" y="28" width="240" height="28" rx="4" fill="#D6EAF8"/>
    <text x="30" y="47" font-size="10" fill="#2471A3">transferSize = headers + compressed body</text>

    <rect x="280" y="28" width="260" height="28" rx="4" fill="#FDEBD0"/>
    <text x="290" y="47" font-size="10" fill="#CA6F1E">encodedBodySize = compressed body (no headers)</text>

    <rect x="560" y="28" width="260" height="28" rx="4" fill="#D5F5E3"/>
    <text x="570" y="47" font-size="10" fill="#1E8449">decodedBodySize = uncompressed body</text>
  </g>

  <!-- MFE metrics -->
  <g transform="translate(30, 530)">
    <rect x="0" y="0" width="840" height="55" rx="8" fill="#2C3E50" opacity="0.06"/>
    <text x="420" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3E50">MFE Comparison Metrics:</text>
    <text x="20" y="40" font-size="10" fill="#555">chunkedJsCount (JS chunks) | largestChunkSize | uniqueDomains (MFE hosts) | domainsList</text>
    <text x="660" y="40" font-size="10" fill="#7F8C8D">Monolith: 1-2 domains, large chunks | MFE: 3+ domains, many small chunks</text>
  </g>
</svg>