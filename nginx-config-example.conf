# Nginx configuration example for metric.pizza.ew-production.ru
# Place this in /etc/nginx/sites-available/metric.pizza.ew-production.ru
# Then: ln -s /etc/nginx/sites-available/metric.pizza.ew-production.ru /etc/nginx/sites-enabled/

upstream metrics_backend {
    server 127.0.0.1:3001;
}

upstream metrics_frontend {
    server 127.0.0.1:8081;
}

server {
    listen 80;
    listen [::]:80;
    server_name metric.pizza.ew-production.ru;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name metric.pizza.ew-production.ru;

    # SSL certificates (adjust paths as needed)
    ssl_certificate /etc/letsencrypt/live/metric.pizza.ew-production.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metric.pizza.ew-production.ru/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # API routes to backend
    location /api {
        proxy_pass http://metrics_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeouts for long-running metrics collection
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Frontend routes
    location / {
        proxy_pass http://metrics_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;
}
