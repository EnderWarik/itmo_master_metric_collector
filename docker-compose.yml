services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nir3-backend
    environment:
      NODE_ENV: production
    ports:
      - '3000:3000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: nir3-frontend
    depends_on:
      - backend
    ports:
      - '8080:80'

