<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A90D9"/>
    </marker>
    <marker id="arrow1r" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27AE60"/>
    </marker>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#E8ECF1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bg1)" rx="12"/>

  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2C3E50">HTTP Ping (availability.ping)</text>
  <text x="400" y="55" text-anchor="middle" font-size="13" fill="#7F8C8D">Node.js fetch + performance.now()</text>

  <!-- Client -->
  <rect x="40" y="80" width="140" height="60" rx="10" fill="#4A90D9" opacity="0.9"/>
  <text x="110" y="107" text-anchor="middle" font-size="14" fill="white" font-weight="bold">Client</text>
  <text x="110" y="125" text-anchor="middle" font-size="11" fill="#D4E6F9">Node.js / fetch()</text>

  <!-- Server -->
  <rect x="620" y="80" width="140" height="60" rx="10" fill="#27AE60" opacity="0.9"/>
  <text x="690" y="107" text-anchor="middle" font-size="14" fill="white" font-weight="bold">Server</text>
  <text x="690" y="125" text-anchor="middle" font-size="11" fill="#D4F5E0">HTTP Response</text>

  <!-- Timeline -->
  <line x1="110" y1="160" x2="110" y2="360" stroke="#4A90D9" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="690" y1="160" x2="690" y2="360" stroke="#27AE60" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- performance.now() start -->
  <rect x="15" y="168" width="190" height="24" rx="5" fill="#FFF3CD"/>
  <text x="110" y="184" text-anchor="middle" font-size="11" fill="#856404">performance.now() = start</text>

  <!-- Request arrow -->
  <line x1="115" y1="205" x2="685" y2="235" stroke="#4A90D9" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="400" y="210" text-anchor="middle" font-size="12" fill="#4A90D9" font-weight="bold">HTTP GET Request</text>
  <text x="400" y="226" text-anchor="middle" font-size="10" fill="#7F8C8D">DNS + TCP + TLS + Request</text>

  <!-- Server processing -->
  <rect x="645" y="240" width="90" height="30" rx="5" fill="#27AE60" opacity="0.2"/>
  <text x="690" y="260" text-anchor="middle" font-size="10" fill="#27AE60">Processing</text>

  <!-- Response arrow -->
  <line x1="685" y1="280" x2="115" y2="310" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow1r)"/>
  <text x="400" y="290" text-anchor="middle" font-size="12" fill="#27AE60" font-weight="bold">HTTP Response (status + body)</text>

  <!-- performance.now() end -->
  <rect x="15" y="318" width="190" height="24" rx="5" fill="#FFF3CD"/>
  <text x="110" y="334" text-anchor="middle" font-size="11" fill="#856404">performance.now() = end</text>

  <!-- elapsedMs formula -->
  <rect x="250" y="340" width="300" height="40" rx="8" fill="#E8DAEF"/>
  <text x="400" y="365" text-anchor="middle" font-size="14" fill="#6C3483" font-weight="bold">elapsedMs = end - start</text>

  <!-- Metrics box -->
  <rect x="590" y="310" width="190" height="80" rx="8" fill="white" stroke="#BDC3C7" stroke-width="1"/>
  <text x="685" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3E50">Metrics</text>
  <text x="600" y="348" font-size="10" fill="#555">elapsedMs: 142.37</text>
  <text x="600" y="363" font-size="10" fill="#555">status: 200</text>
  <text x="600" y="378" font-size="10" fill="#555">ok: true</text>
</svg>